<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HW-04</title>
    <link rel="stylesheet" href="./css/styles.css" />

    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <main>
      <div class="container">
        <form class="form js-form">
          <label>
            <input
              type="text"
              name="search-text"
              placeholder="Search images..."
            />
          </label>
          <button class="submit-btn btn js-submit-btn" type="submit">
            Search
          </button>
        </form>
        <div class="gallery-wrapper">
          <ul class="gallery js-gallery"></ul>
          <button
            class="load-more-btn btn js-load-more is-hidden"
            type="button"
          >
            Load more
          </button>
          <span class="loader js-loader"></span>
        </div>
      </div>
    </main>
  </body>
</html>
